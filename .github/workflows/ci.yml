name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test (specs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run specs
        run: npm test

  build:
    name: Build workspaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

  docker:
    name: Docker compose build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -skf https://localhost:8443/health > /dev/null; then
              echo "health OK"
              exit 0
            fi
            sleep 2
          done
          echo "health check failed"
          docker compose logs
          exit 1

      - name: Check top page
        run: |
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/)
          echo "top page: HTTP $code"
          test "$code" = "200"

      - name: Tear down
        if: always()
        run: docker compose down --volumes
